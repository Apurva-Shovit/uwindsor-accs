version: '3.8'

services:
  mongo:
    image: mongo:latest
    container_name: acare-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: acare-api
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=mongodb://mongo:27017
      - MONGODB_DB_NAME=acare-mvp
      - SECRET_KEY=super-secret-key-change-in-prod-123456789
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_HOURS=12
    depends_on:
      - mongo

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: acare-web
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  mongo-data:
